<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShowTime - Book Tickets</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>

        <div class="logo">🎬 ShowTime</div>

        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="index.html">Logout</a>
        </div>

    </nav>


    <!-- Booking Section -->
    <section class="form-section">

        <div class="form-container">

            <h1>Book Your Tickets 🎟️</h1>

            <p>Select your movie and booking details.</p>


            <form id="bookingForm">

                <!-- Movie -->
                <label for="movie">Select Movie</label>

                <select id="movie" name="movie" required>

                    <option value="">Choose a movie</option>

                    <option value="Avengers: Endgame">
                        Avengers: Endgame
                    </option>

                    <option value="Interstellar">
                        Interstellar
                    </option>

                    <option value="Inception">
                        Inception
                    </option>

                </select>


                <!-- Date -->
                <label for="date">Select Date</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >


                <!-- Show Time -->
                <label for="time">Select Show Time</label>

                <select id="time" name="time" required>

                    <option value="">Choose a time</option>

                    <option value="10:00 AM">
                        10:00 AM
                    </option>

                    <option value="1:30 PM">
                        1:30 PM
                    </option>

                    <option value="5:00 PM">
                        5:00 PM
                    </option>

                    <option value="8:30 PM">
                        8:30 PM
                    </option>

                </select>


                <!-- Number of Tickets -->
                <label for="tickets">Number of Tickets</label>

                <input
                    type="number"
                    id="tickets"
                    name="tickets"
                    min="1"
                    max="10"
                    required
                >

                <!-- Seat -->
                <label>Choose Your Seats</label>

<div class="screen">
    SCREEN
</div>

<div class="seat-container">

    <button type="button" class="seat" data-seat="A1">A1</button>
    <button type="button" class="seat" data-seat="A2">A2</button>
    <button type="button" class="seat" data-seat="A3">A3</button>
    <button type="button" class="seat" data-seat="A4">A4</button>
    <button type="button" class="seat" data-seat="A5">A5</button>

    <button type="button" class="seat" data-seat="B1">B1</button>
    <button type="button" class="seat" data-seat="B2">B2</button>
    <button type="button" class="seat" data-seat="B3">B3</button>
    <button type="button" class="seat" data-seat="B4">B4</button>
    <button type="button" class="seat" data-seat="B5">B5</button>

    <button type="button" class="seat" data-seat="C1">C1</button>
    <button type="button" class="seat" data-seat="C2">C2</button>
    <button type="button" class="seat" data-seat="C3">C3</button>
    <button type="button" class="seat" data-seat="C4">C4</button>
    <button type="button" class="seat" data-seat="C5">C5</button>

    <button type="button" class="seat" data-seat="D1">D1</button>
    <button type="button" class="seat" data-seat="D2">D2</button>
    <button type="button" class="seat" data-seat="D3">D3</button>
    <button type="button" class="seat" data-seat="D4">D4</button>
    <button type="button" class="seat" data-seat="D5">D5</button>

</div>

<p id="selectedSeatsMessage">
    Selected Seats: None
</p>


                <button type="submit">
                    Confirm Booking
                </button>

            </form>


            <p id="bookingMessage"></p>

        </div>

    </section>


    <footer>

        <p>© 2026 ShowTime. All Rights Reserved.</p>

    </footer>


<script src="js/script.js"></script>

</body>

</html>
